<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Trusted local splash. Logo arrives as a data: URI (injected by main); the
       only script is our own splash.js. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data:;">
  <title>Dashboard Engine</title>
  <style>
    :root { --cyan: #3FD8FF; }
    html, body {
      margin: 0; height: 100%; background: transparent; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-user-select: none; user-select: none; cursor: default;
    }
    /* Inset a touch so the card's drop-shadow renders inside the transparent window. */
    .card {
      position: absolute; inset: 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; padding: 30px 40px; box-sizing: border-box;
      background: linear-gradient(160deg, #0f1926 0%, #0a121c 62%, #080d15 100%);
      border: 1px solid rgba(63, 216, 255, 0.16); border-radius: 18px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
    }
    .logo { width: 300px; max-width: 78%; height: auto; filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.5)); }
    .barwrap { width: 260px; max-width: 80%; height: 4px; border-radius: 4px; background: rgba(160, 200, 230, 0.12); overflow: hidden; }
    .bar {
      height: 100%; width: 40%; border-radius: 4px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      animation: slide 1.25s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-130%); } 100% { transform: translateX(330%); } }
    .status { font-size: 12.5px; letter-spacing: .6px; color: #9fb4c6; min-height: 16px; }
    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none; width: 55%; background: var(--cyan); }
    }
  </style>
</head>
<body>
  <div class="card">
    <img id="logo" class="logo" alt="Dashboard Engine">
    <div class="barwrap"><div class="bar"></div></div>
    <div id="status" class="status">Initializing…</div>
  </div>
  <script src="splash.js"></script>
</body>
</html>
