<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Same strict CSP as the desktop; frame-src demodule: lets module
       components render in the preview; media-src depack: lets a video
       wallpaper load so previews aren't captured black. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self'; script-src 'self'; font-src 'self'; img-src 'self' data:; media-src depack:; frame-src demodule:">
  <title>Dashboard Engine — preview</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <!-- Off-screen render used only to produce a Workshop preview image. It uses
       demo data, never the user's real stats/apps/notifications/reminders. -->
  <main class="canvas-outer" aria-label="Pack preview">
    <div class="canvas" id="canvas"></div>
  </main>
  <!-- capture-clock installs a deterministic virtual clock ONLY with ?capture=1
       (the trailer recorder); it's a no-op for normal preview renders. Must load
       first so the renderer's rAF + clock reads use it. -->
  <script src="capture-clock.js"></script>
  <script src="gl-background.js"></script>
  <script src="particles.js"></script>
  <script src="components.js"></script>
  <script src="shot.js"></script>
</body>
</html>
