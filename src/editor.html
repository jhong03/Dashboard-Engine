<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- frame-src demodule: lets the stage render sandboxed `module` components;
       media-src depack: lets the stage play a video wallpaper live. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self'; script-src 'self'; font-src 'self'; img-src 'self' data:; media-src depack:; frame-src demodule:">
  <title>Editor — Dashboard Engine</title>
  <!-- Order matters: dashboard.css styles pack content (the canvas), then
       chrome.css wins the shared :root tokens for the app chrome around it.
       applySkin() re-sets pack tokens inline on the canvas's skin root. -->
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="chrome.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body class="editor-body">

  <header class="ed-bar">
    <div class="ed-brand">
      <h1 data-i18n="editor.title">Editor</h1>
      <p class="ed-sub" id="ed-base">—</p>
    </div>
    <label class="visually-hidden" for="ed-name" data-i18n="editor.packName">Pack name</label>
    <input id="ed-name" type="text" class="ed-name" maxlength="60" spellcheck="false">
    <div class="ed-actions">
      <button class="btn" id="btn-save" data-i18n="common.save">Save</button>
      <button class="btn primary" id="btn-save-apply" data-i18n="editor.saveApply">Save &amp; apply</button>
    </div>
  </header>
  <p class="status-line-app ed-status" id="ed-status" role="status" aria-live="polite"></p>

  <div class="ed-main">
    <aside class="ed-palette" aria-label="Component palette" data-i18n-attr="aria-label:editor.paletteLabel">
      <h2 data-i18n="editor.palette.title">Components</h2>
      <p class="hint" data-i18n="editor.palette.hint">Drag onto the canvas, or double-click to add.</p>
      <ul id="palette"></ul>
      <button class="btn tiny" id="btn-import-image" data-i18n="editor.importImage">Import image…</button>
      <p class="hint" style="margin-top:6px" data-i18n="editor.palette.imageHint">Your own PNG, JPG, or WebP — saved into the pack.</p>
    </aside>

    <main class="ed-stage-outer">
      <div class="ed-stage" id="stage">
        <div class="skin-root ed-skin" id="skin">
          <div class="canvas" id="canvas"></div>
        </div>
        <div class="ed-overlay" id="overlay"></div>
      </div>
    </main>

    <aside class="ed-inspector" aria-label="Inspector" data-i18n-attr="aria-label:editor.inspectorLabel">
      <div class="ed-tabs" role="tablist">
        <button class="tab" id="itab-component" aria-selected="true" data-i18n="editor.tab.component">Component</button>
        <button class="tab" id="itab-skin" aria-selected="false" data-i18n="editor.tab.skin">Skin</button>
        <button class="tab" id="itab-persona" aria-selected="false" data-i18n="editor.tab.persona">Persona</button>
        <button class="tab" id="itab-props" aria-selected="false" data-i18n="editor.tab.customize">Customize</button>
      </div>
      <div class="ed-panel" id="inspector"></div>
    </aside>
  </div>

  <!-- capture-clock.js FIRST (no-op unless ?capture=1): routes every rAF/clock
       read through the trailer recorder's virtual clock. -->
  <!-- Dev-only perf HUD (?perf=1 / DE_PERF); loads first so it can instrument
       timers/rafs before any app code registers them. Inert otherwise. -->
  <script src="perf-hud.js"></script>
  <script src="capture-clock.js"></script>
  <!-- i18n.js FIRST: it defines window.t / I18n.applyDom and translates the
       static [data-i18n] markup before the app scripts run. -->
  <script src="i18n.js"></script>
  <script src="gl-background.js"></script>
  <script src="particles.js"></script>
  <script src="components.js"></script>
  <script src="pack-presets.js"></script>
  <script src="editor.js"></script>
  <!-- Editor-trailer choreography (no-op unless ?demo=1). -->
  <script src="editor-demo.js"></script>
</body>
</html>
